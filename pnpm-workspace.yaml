packages:
  - apps/*
  - packages/*

# One version per tool across the monorepo; packages reference these with "catalog:".
# typescript is held at 6.0.x because typescript-eslint 8.x supports <6.1.
catalog:
  '@eslint/js': ^10.0.1
  '@types/node': ^22.20.4
  eslint: ^10.11.0
  globals: ^17.12.0
  prettier: ^3.9.9
  turbo: ^2.11.4
  typescript: ~6.0.3
  typescript-eslint: ^8.70.1
  vitest: ^5.0.2
  # Front-end stack (L5 section 2), added with T0.7.
  '@tailwindcss/vite': ^4.3.3
  '@tanstack/react-query': ^5.104.0
  '@testing-library/react': ^16.3.3
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@vitejs/plugin-react': ^6.1.1
  i18next: ^26.4.2
  jsdom: ^30.1.1
  react: ^19.3.0
  react-dom: ^19.3.0
  react-i18next: ^17.0.15
  tailwindcss: ^4.3.3
  viem: ^2.56.9
  vite: ^8.3.1

# Supply-chain hardening (L7 section 3): only allowlisted packages may run install scripts.
onlyBuiltDependencies: []
