packages:
  - apps/*
  - packages/*

# One version per tool across the monorepo; packages reference these with "catalog:".
# typescript is held at 6.0.x because typescript-eslint 8.x supports <6.1.
catalog:
  '@eslint/js': ^10.0.1
  '@types/node': ^22.20.4
  eslint: ^10.11.0
  globals: ^17.12.0
  prettier: ^3.9.9
  turbo: ^2.11.4
  typescript: ~6.0.3
  typescript-eslint: ^8.70.1
  vitest: ^5.0.2

# Supply-chain hardening (L7 section 3): only allowlisted packages may run install scripts.
onlyBuiltDependencies: []
